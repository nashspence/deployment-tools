[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools"
version = "0.1.0.dev0"
description = "Generic SSH-oriented deployment tools: contract models and implementation scaffold"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "referencing==0.37.0",
  "PyYAML==6.0.3",
  "cryptography==50.0.2",
]

[project.scripts]
domain-ops = "deployment_tools.cli:domain_main"
host-ops = "deployment_tools.cli:host_main"
app-ops = "deployment_tools.cli:app_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools = ["contracts/*.json", "contracts/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
