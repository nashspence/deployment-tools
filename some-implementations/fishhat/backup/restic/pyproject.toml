[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-fishhat-restic-adapter"
version = "0.1.0.dev0"
description = "restic adapter: closed configuration scaffold; no native execution claim"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-adapter-support==0.1.0.dev0"]

[project.scripts]
a-fishhat-restic-adapter = "a_fishhat_restic_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_fishhat_restic_adapter = ["py.typed", "descriptor.json"]

[tool.uv.sources]
fishhat-adapter-support = { workspace = true }

[tool.fishhat.component]
id = "restic-adapter"
module = "a_fishhat_restic_adapter"
role = "adapter-implementation"
