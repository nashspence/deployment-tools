[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fishhat-directory"
version = "0.1.0.dev0"
description = "Fishhat optional-discovery reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-contracts==0.1.0.dev0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fishhat_directory = ["py.typed"]

[tool.uv.sources]
fishhat-contracts = { workspace = true }

[tool.fishhat.component]
id = "directory"
module = "fishhat_directory"
role = "optional-discovery"
