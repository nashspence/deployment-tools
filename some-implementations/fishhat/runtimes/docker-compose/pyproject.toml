[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-fishhat-docker-compose-runtime"
version = "0.1.0.dev0"
description = "docker-compose adapter: closed configuration scaffold; no native execution claim"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-adapter-support==0.1.0.dev0"]

[project.scripts]
a-fishhat-docker-compose-runtime = "a_fishhat_docker_compose_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_fishhat_docker_compose_runtime = ["py.typed", "descriptor.json"]

[tool.uv.sources]
fishhat-adapter-support = { workspace = true }

[tool.fishhat.component]
id = "docker-compose-runtime"
module = "a_fishhat_docker_compose_runtime"
role = "adapter-implementation"
