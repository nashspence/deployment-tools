[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a-fishhat-git-bundle-bootstrap"
version = "0.1.0.dev0"
description = "git-bundle source bootstrap: closed input scaffold; no native execution claim"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["fishhat-adapter-support==0.1.0.dev0"]

[project.scripts]
a-fishhat-git-bundle-bootstrap = "a_fishhat_git_bundle_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_fishhat_git_bundle_bootstrap = ["py.typed", "descriptor.json"]

[tool.uv.sources]
fishhat-adapter-support = { workspace = true }

[tool.fishhat.component]
id = "git-bundle-bootstrap"
module = "a_fishhat_git_bundle_bootstrap"
role = "adapter-implementation"
