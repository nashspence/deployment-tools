[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-domain"
version = "0.1.0.dev0"
description = "Portable domain command frontend"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["deployment-tools-client==0.1.0.dev0", "deployment-tools-cli-support==0.1.0.dev0"]

[project.scripts]
domain-ops = "deployment_tools_domain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_domain = ["py.typed"]

[tool.uv.sources]
deployment-tools-client = { workspace = true }
deployment-tools-cli-support = { workspace = true }

[tool.deployment-tools.component]
id = "domain"
module = "deployment_tools_domain"
role = "domain-client"
