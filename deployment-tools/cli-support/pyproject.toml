[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-cli-support"
version = "0.1.0.dev0"
description = "Deployment tools shared-cli reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["deployment-tools-contracts==0.1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_cli = ["py.typed"]

[tool.uv.sources]
deployment-tools-contracts = { workspace = true }

[tool.deployment-tools.component]
id = "cli-support"
module = "deployment_tools_cli"
role = "shared-cli"
