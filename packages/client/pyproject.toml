[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-client"
version = "0.1.0.dev0"
description = "Deployment tools portable-client reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["deployment-tools-contracts==0.1.0.dev0", "deployment-tools-cli-support==0.1.0.dev0"]

[project.scripts]
domain-ops = "deployment_tools_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_client = ["py.typed"]

[tool.uv.sources]
deployment-tools-contracts = { workspace = true }
deployment-tools-cli-support = { workspace = true }
