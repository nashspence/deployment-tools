[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-directory"
version = "0.1.0.dev0"
description = "Deployment tools optional-discovery reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["deployment-tools-contracts==0.1.0.dev0", "PyYAML==6.0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_directory = ["py.typed"]

[tool.uv.sources]
deployment-tools-contracts = { workspace = true }
