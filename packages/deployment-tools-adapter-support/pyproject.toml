[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-adapter-support"
version = "0.1.0.dev0"
description = "Bounded local adapter command support; no native dispatch"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["deployment-tools-adapter-protocol==0.1.0.dev0", "deployment-tools-contracts==0.1.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_adapter_support = ["py.typed"]

[tool.uv.sources]
deployment-tools-adapter-protocol = { workspace = true }
deployment-tools-contracts = { workspace = true }

[tool.deployment-tools.component]
id = "adapter-support"
module = "deployment_tools_adapter_support"
role = "adapter-support"
