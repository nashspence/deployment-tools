[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-tools-contracts"
version = "0.1.0.dev0"
description = "Deployment tools shared-contracts reference scaffold"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0", "PyYAML==6.0.3", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deployment_tools_contracts = ["py.typed", "contracts/*.json"]
